<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SESE V3 — Internal Cinema Engine — b10fhonix.online</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--c:#1a1a1f;--l:#26262f;--t:#f2f2f5;--m:#8a8e98;--a:#7c7cff;--a2:#7EC8F0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,sans-serif}
#nav{height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid var(--l);position:sticky;top:0;background:rgba(8,8,10,0.96);z-index:10}
.logo{font-weight:800}.logo span{color:var(--a2)}
#layout{display:grid;grid-template-columns:340px 1fr 340px;gap:10px;max-width:1600px;margin:0 auto;padding:10px}
@media(max-width:1100px){#layout{grid-template-columns:1fr}}
.panel{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:12px}
textarea{width:100%;min-height:110px;background:#000;color:#fff;border:1px solid var(--l);border-radius:12px;padding:10px;font-family:JetBrains Mono,monospace;font-size:12px}
button{background:var(--c);color:var(--t);border:1px solid var(--l);border-radius:99px;padding:9px 14px;font-weight:600;font-size:12px;cursor:pointer;margin:3px}
button.primary{background:var(--t);color:#000}
select{width:100%;background:#000;color:#fff;border:1px solid var(--l);border-radius:10px;padding:8px;margin:4px 0}
.code{background:#0a0a0c;border:1px solid var(--l);border-radius:10px;padding:8px;font-family:JetBrains Mono,monospace;font-size:10px;white-space:pre-wrap;max-height:300px;overflow:auto;color:var(--m)}
.small{font-size:11px;color:var(--m);font-family:JetBrains Mono,monospace}
#stage{border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--l);aspect-ratio:16/9}
canvas{width:100%;height:100%;display:block}
#strip{display:flex;gap:6px;overflow:auto;padding:8px 0}
.shot{min-width:88px;height:52px;border-radius:10px;background:#111;border:1px solid var(--l);display:flex;align-items:center;justify-content:center;font-size:9px;font-family:JetBrains Mono,monospace;cursor:pointer}
.shot.active{border-color:var(--a)}
.progress{flex:1;height:6px;background:#111;border-radius:99px;overflow:hidden}.progress div{height:100%;width:0%;background:linear-gradient(90deg,var(--a),var(--a2))}
#timeline{display:flex;gap:4px;overflow:auto;margin:8px 0}
.tblock{min-width:76px;padding:6px;border-radius:8px;background:#111;border:1px solid var(--l);font-size:9px;font-family:JetBrains Mono,monospace}
</style>
</head>
<body>
<div id="nav"><div class="logo">SESE V3 <span>INTERNAL</span> — b10fhonix.online</div><div class="small">Story → Narrative Compiler → Director → Continuity → Frame Engine → Timeline → Master</div><button id="masterBtn" class="primary">EXPORT WEBM</button></div>
<div id="layout">
<div class="panel"><h3>NARRATIVE COMPILER</h3><textarea id="storyInput" placeholder="Paste story..."></textarea><div style="display:flex;gap:6px"><select id="genre"><option>Afro Sci-Fi Healing</option><option>Sci-Fi Thriller</option><option>Cinematic Drama</option></select><select id="lens"><option>Anamorphic 35mm</option><option>50mm Spherical</option></select></div><button id="compile" class="primary" style="width:100%">COMPILE STORY → SCENE GRAPH</button><button id="loadEx" style="width:100%">Load Example Story</button><pre id="sceneGraph" class="code"></pre><div id="charBible" class="small"></div><div id="worldBible" class="small" style="margin-top:8px"></div></div>
<div class="panel"><h3>CINEMATOGRAPHY — <span id="shotLabel">No shot</span></h3><div id="stage"><canvas id="master" width="1920" height="1080"></canvas><canvas id="hidden" width="1920" height="1080" style="display:none"></canvas></div><div style="display:flex;gap:8px;margin-top:8px;align-items:center"><div class="progress"><div id="prog"></div></div><span id="tc" class="small">00:00</span></div><div id="strip"></div><div id="timeline"></div><div style="display:flex;gap:6px"><button id="renderAll" class="primary">RENDER ALL SHOTS</button><button id="play">PLAY TIMELINE</button></div><div id="final" style="margin-top:8px"></div><pre id="log" class="code" style="height:140px">SESE V3 Ready — Single File Engine
</pre></div>
<div class="panel"><h3>DIRECTOR / SHOT GRAPH</h3><pre id="shotGraph" class="code"></pre><h3>PROPERTIES</h3><label class="small">Camera Rig</label><select id="rig"><option value="dolly_in">Dolly In</option><option value="orbit">Orbit 30deg</option><option value="crane_up">Crane Up</option><option value="handheld">Handheld</option></select><label class="small">Light</label><select id="light"><option value="volumetric">Volumetric</option><option value="neon">Neon Pulse</option><option value="dawn">Dawn Portal</option></select><pre id="json" class="code" style="max-height:200px"></pre><button id="expJson" style="width:100%">Export.sese.json</button></div>
</div>
<script>
const $=s=>document.querySelector(s); const log=m=>{const e=$('#log'); e.textContent+=`\n${new Date().toLocaleTimeString()} ${m}`; e.scrollTop=e.scrollHeight;};
const hash=s=>{let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h);};
const detRand=(seed,f,salt=0)=>{const x=Math.sin(seed*9999+f*0.13+salt*7.7)*10000;return x-Math.floor(x);};
let project=null; let clips={};
const Narrative={compile(raw,genre){const sens=raw.split(/[.!?]+/).map(s=>s.trim()).filter(s=>s.length>12);const beats=sens.map((s,i)=>{const l=s.toLowerCase();let mood='tense';if(l.includes('dawn')||l.includes('hope')||l.includes('light'))mood='triumphant';else if(l.includes('memory')||l.includes('orb'))mood='dream';let loc='Abandoned Room';if(l.includes('corridor'))loc='Corridor - Electric Pulse';else if(l.includes('machine')||l.includes('console'))loc='Old Machine - Glowing Display';else if(l.includes('orb')||l.includes('memory'))loc='Memory Void - White';else if(l.includes('portal')||l.includes('dawn'))loc='Roof - Dawn Portal';return{index:i,text:s,mood,location:loc,time:'00:15',duration:8};});const cands={};raw.split(/\s+/).forEach(w=>{const c=w.replace(/[^A-Za-z]/g,'');if(c.length>2&&c[0]===c[0].toUpperCase())cands[c]=(cands[c]||0)+1;});let tops=Object.entries(cands).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);if(!tops.length)tops=['Alex','Maya'];const chars=tops.map(n=>{const seed=hash(n);return{name:n,seed,description:`${n}, consistent face seed ${seed}`,visualSeed:`${n} seed ${seed}`};});const world=`World: ${[...new Set(beats.map(b=>b.location))].join(' -> ')}. ${raw.slice(0,200)}`;const per=Math.ceil(beats.length/5);const scenes=[];for(let i=0;i<5;i++){const ch=beats.slice(i*per,(i+1)*per);if(!ch.length)continue;scenes.push({id:`scene_${String(i+1).padStart(2,'0')}`,location:ch[0].location,time:ch[0].time,mood:ch[0].mood,beats:ch,characters:chars.map(c=>c.name)});}return{title:raw.slice(0,28),raw,genre,beats,characters:chars,worldBible:world,sceneGraph:scenes};}};
const Director={plan(sg,opts){const out=[];sg.forEach(sc=>{for(let si=0;si<2;si++){const beat=sc.beats[Math.min(si,sc.beats.length-1)];const ch=sc.characters[0]||'Alex';const seed=hash(ch);out.push({id:`${sc.id}_shot_${String(si+1).padStart(2,'0')}`,scene:sc.id,location:sc.location,mood:sc.mood,camera:si===1?'close-up 35mm anamorphic':'wide 35mm anamorphic',lens:'35mm anamorphic',movement:opts.rig,light:opts.light,action:beat.text.slice(0,60),narration:si===0?beat.text.slice(0,180):'',dialogue:si===1?beat.text.slice(0,120):'',seed,duration:beat.duration});}});return out;}};
const Renderer={preview(s){const c=$('#master').getContext('2d');c.fillStyle='#000';c.fillRect(0,0,1920,1080);c.fillStyle='#666';c.font='20px Inter';c.fillText(`${s.id} — ${s.location} — ${s.camera}`,60,540);},async renderShot(shot){const canvas=document.createElement('canvas');canvas.width=1920;canvas.height=1080;const ctx=canvas.getContext('2d');const stream=canvas.captureStream(24);const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9'});let chunks=[];rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};const done=new Promise(r=>{rec.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});const url=URL.createObjectURL(blob);clips[shot.id]={url,blob,duration:shot.duration};$('#master').getContext('2d').drawImage(canvas,0,0);r();};});rec.start();const max=shot.duration*24;let f=0;const draw=()=>{const rnd=n=>detRand(shot.seed,f,n);if(shot.location.includes('Machine')){ctx.fillStyle='#080a14';ctx.fillRect(0,0,1920,1080);ctx.fillStyle='rgba(20,22,34,0.9)';ctx.fillRect(320,220,1280,620);ctx.strokeStyle='rgba(124,124,255,0.22)';ctx.strokeRect(320,220,1280,620);const p=0.4+Math.sin(f/10)*0.2;ctx.shadowColor='#7EC8F0';ctx.shadowBlur=40*p;ctx.fillStyle=`rgba(200,230,255,${p})`;ctx.beginPath();ctx.arc(960,520,44,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(124,200,240,0.35)';ctx.beginPath();for(let x=0;x<1280;x+=8){const y=520+Math.sin((x+f*4)/80)*20*rnd(1);if(x===0)ctx.moveTo(320+x,y);else ctx.lineTo(320+x,y);}ctx.stroke();}else if(shot.location.includes('Void')||shot.location.includes('Memory')){ctx.fillStyle='#020208';ctx.fillRect(0,0,1920,1080);const p=1+Math.sin(f/16)*0.18;ctx.save();ctx.translate(960,540);ctx.scale(p,p);ctx.fillStyle='#fff';ctx.shadowColor='#7c7cff';ctx.shadowBlur=28;ctx.beginPath();ctx.arc(0,0,30,0,Math.PI*2);ctx.fill();ctx.restore();}else if(shot.location.includes('Dawn')||shot.location.includes('Roof')){const g=ctx.createLinearGradient(0,0,0,1080);g.addColorStop(0,'#1a182a');g.addColorStop(1,'#ffb86a');ctx.fillStyle=g;ctx.fillRect(0,0,1920,1080);}else{ctx.fillStyle='#0c0c14';ctx.fillRect(0,0,1920,1080);}const cx=960+Math.sin(f/90+shot.seed*0.001)*18;ctx.fillStyle='rgba(255,255,255,0.07)';ctx.beginPath();ctx.ellipse(cx,680,46,98,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx,580,28,0,Math.PI*2);ctx.fill();if(shot.location.includes('Machine')){const grad=ctx.createRadialGradient(960,520,10,960,520,600);grad.addColorStop(0,'rgba(126,200,240,0.14)');grad.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=grad;ctx.fillRect(0,0,1920,1080);}ctx.fillStyle='rgba(0,0,0,0.62)';ctx.fillRect(0,0,1920,82);ctx.fillRect(0,998,1920,82);ctx.fillStyle='rgba(255,255,255,0.04)';for(let i=0;i<120;i++){ctx.fillRect(rnd(i)*1920,rnd(i+100)*1080,1,1);}ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,880,1920,118);ctx.fillStyle='#fff';ctx.font='600 20px Inter';ctx.fillText((shot.narration||shot.dialogue||'').slice(0,110),32,926);ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='11px JetBrains Mono';ctx.fillText(`${shot.camera} | ${shot.location} | seed:${shot.seed} | ${shot.light}`,32,952);f++;if(f<max)requestAnimationFrame(draw);else rec.stop();};draw();await done;log(`[RENDERER] ${shot.id} rendered`);},async masterAssemble(sg,finalDiv){if(!Object.keys(clips).length){alert('Render first');return;}const ordered=sg.filter(s=>clips[s.id]);const c=$('#hidden');const ctx=c.getContext('2d');const stream=c.captureStream(24);const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9'});let chunks=[];rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};const done=new Promise(r=>{rec.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});const url=URL.createObjectURL(blob);finalDiv.innerHTML=`<video controls src="${url}" style="width:100%;border-radius:16px"></video><br><a href="${url}" download="SESE_V3_MASTER.webm"><button class="primary" style="width:100%">⬇ DOWNLOAD MASTER</button></a>`;r();};});rec.start();for(let idx=0;idx<ordered.length;idx++){const s=ordered[idx];const clip=clips[s.id];const v=document.createElement('video');v.src=clip.url;v.muted=true;await new Promise(r=>{v.onloadedmetadata=()=>{v.play();r();};});const frames=clip.duration*24;let f=0;await new Promise(r=>{const loop=()=>{let a=1;if(f<12&&idx>0)a=f/12;ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,1920,1080);ctx.globalAlpha=a;ctx.drawImage(v,0,0,1920,1080);ctx.globalAlpha=1;f++;if(f<frames&&!v.ended)requestAnimationFrame(loop);else r();};loop();});}rec.stop();await done;log('[MASTER] Ready');}};
$('#compile').onclick=()=>{const raw=$('#storyInput').value.trim();if(!raw){alert('Paste story');return;}log('[NARRATIVE] Compiling...');const comp=Narrative.compile(raw,$('#genre').value);project=comp;$('#sceneGraph').textContent=JSON.stringify(comp.sceneGraph,null,2);$('#charBible').innerHTML=comp.characters.map(c=>`<div style="padding:8px;border:1px solid #26262f;border-radius:10px;margin:6px 0;background:#121214"><b>${c.name}</b> <span style="color:#7EC8F0">${c.seed}</span><br><span class="small">${c.description}</span></div>`).join('');$('#worldBible').innerHTML=`<span class="small">${comp.worldBible}</span>`;const shots=Director.plan(comp.sceneGraph,{rig:$('#rig').value,light:$('#light').value});project.shotGraph=shots;$('#shotGraph').textContent=JSON.stringify(shots.slice(0,2),null,2);$('#json').textContent=JSON.stringify({scenes:comp.sceneGraph.length,shots:shots.length},null,2);const strip=$('#strip');strip.innerHTML='';shots.forEach(s=>{const d=document.createElement('div');d.className='shot';d.id='shot_'+s.id;d.textContent=s.id.replace('scene_','S');d.onclick=()=>{document.querySelectorAll('.shot').forEach(x=>x.classList.remove('active'));d.classList.add('active');$('#shotLabel').textContent=`${s.id} | ${s.location} | ${s.camera}`;Renderer.preview(s);};strip.appendChild(d);});if(strip.firstChild)strip.firstChild.click();const tl=$('#timeline');tl.innerHTML='';shots.forEach(s=>{const b=document.createElement('div');b.className='tblock';b.textContent=s.id;tl.appendChild(b);});log(`[DIRECTOR] ${shots.length} shots planned`);};
$('#renderAll').onclick=async()=>{if(!project)return alert('Compile first');for(let i=0;i<project.shotGraph.length;i++){await Renderer.renderShot(project.shotGraph[i]);$('#prog').style.width=((i+1)/project.shotGraph.length*100)+'%';const el=document.getElementById('shot_'+project.shotGraph[i].id);if(el)el.style.background='#1a2a1a';}log('All rendered');};
$('#masterBtn').onclick=async()=>{await Renderer.masterAssemble(project.shotGraph,$('#final'));};
$('#play').onclick=()=>{let i=0;const next=()=>{if(!project||i>=project.shotGraph.length)return;const s=project.shotGraph[i];$('#shotLabel').textContent=s.id;Renderer.preview(s);i++;setTimeout(next,800);};next();};
$('#loadEx').onclick=()=>{$('#storyInput').value=`A young man wakes up in a dark room. He hears a strange electrical pulse that seems to follow him. He follows the corridor that flickers with blue light. He discovers an old machine connected to a glowing display that reacts to his thoughts. The console shows a floating orb. He touches the orb and sees memories of everyone who used the machine before him — their fears, their hopes. He realizes the machine doesn't control people, people planted their stories into it. He decides to plant his own story, one about return and light, and the machine opens a portal of dawn.`;};
$('#expJson').onclick=()=>{const b=new Blob([JSON.stringify(project,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='project.sese.json';a.click();};
</script>
</body>
</html>
