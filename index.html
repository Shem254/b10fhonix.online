<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>b10.online | Binary Phoenix — Portal Landing</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--sky:#7EC8F0;--orange:#FF6A1A;--ink:#1a2a3a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;overflow:hidden;height:100vh;background:radial-gradient(900px 600px at 88% 10%, #FFE28A 0%, #FF9A3A 12%, #FF7A2E 20%, #7EC8F0 52%, #A8DCF8 100%);color:var(--ink)}
.mono{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em}
/* SUN */
.sun{position:absolute;top:4%;right:5%;width:92px;height:92px;background:radial-gradient(circle at 50% 50%, #FFFFFF 0%, #FFF2A0 35%, #FFC14A 70%);border-radius:50%;box-shadow:0 0 90px 35px rgba(255,213,80,.9), 0 0 180px 80px rgba(255,106,26,.45);z-index:1}
/* CLOUDS like screenshot — soft white with deep orange bottom */
.cloud{position:absolute;z-index:2;filter:blur(.2px)}
.cloud:before{content:'';position:absolute;inset:0;background:#fff;border-radius:50%}
.c1{left:-4%;top:10%;width:380px;height:220px;background:#fff;border-radius:60% 40% 50% / 60% 60% 40% 40%;box-shadow:inset -40px -30px 50px rgba(255,106,26,.38), 0 20px 50px rgba(0,0,0,.08)}
.c1:after{content:'';position:absolute;bottom:-18px;left:12%;width:76%;height:42px;background:linear-gradient(180deg,#FFD2B0,#FF6A1A);border-radius:50%;filter:blur(6px);opacity:.9}
.c2{right:12%;bottom:10%;width:520px;height:150px;background:linear-gradient(180deg,#fff,#FFE8D6);border-radius:50%;opacity:.9;box-shadow:inset 0 -18px 30px rgba(255,106,26,.22)}
.c3{left:10%;bottom:0%;width:600px;height:120px;background:#fff;border-radius:50%;opacity:.8}

/* BAY */
.top{position:absolute;top:16px;left:20px;right:20px;display:flex;justify-content:space-between;z-index:10;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.3)}
.bay{position:relative;z-index:3;width:100%;height:100vh;display:grid;place-items:center}
.orbit{position:absolute;width:760px;height:760px;border:1px dashed rgba(255,255,255,.22);border-radius:50%;pointer-events:none;left:50%;top:52%;transform:translate(-50%,-50%)}
.diamond{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78px;height:78px;background:linear-gradient(135deg,#E6F7FF,#9DD9FF 50%,#fff);clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);box-shadow:0 0 30px rgba(157,217,255,.9),0 0 80px rgba(255,255,255,.7);animation:float 4s ease-in-out infinite;z-index:4}
.diamond:after{content:'';position:absolute;inset:-20px;background:conic-gradient(from 0deg,#FF5A2E,#FFD93D,#6BFF8A,#5A8CFF,#B07AFF,#FF5A2E);filter:blur(14px);opacity:.65;border-radius:50%;animation:spin 6s linear infinite;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-10px)}}

/* ORBS — exact like screenshot: glass with rainbow rim + white icon */
.orbs{position:relative;width:740px;height:620px}
.orb{position:absolute;width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0%,rgba(220,240,255,.85) 38%,rgba(120,140,170,.65) 78%);border:2px solid rgba(255,255,255,.75);box-shadow:0 0 0 4px rgba(255,255,255,.12),0 0 22px rgba(255,255,255,.6),inset 0 0 18px rgba(255,255,255,.8);display:grid;place-items:center;cursor:pointer;transition:.35s;backdrop-filter:blur(6px);z-index:5}
.orb:before{content:'';position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,#FF5A2E,#FFD93D,#6BFF8A,#5A8CFF,#B07AFF,#FF5A2E);filter:blur(7px);opacity:.95;z-index:-1}
.orb:hover{transform:scale(1.12) translateY(-6px)}
.orb .ic{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.6);display:grid;place-items:center;color:#fff;font-size:28px;backdrop-filter:blur(2px)}
.orb label{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(26,42,58,.88);color:#fff;padding:4px 10px;border-radius:20px;font-size:8px;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono';box-shadow:0 2px 10px rgba(0,0,0,.2)}
.orb[data-p="cosmos"]{left:50%;top:0%;transform:translateX(-50%)}
.orb[data-p="comm"]{left:18%;top:14%}.orb[data-p="ai"]{right:14%;top:18%}
.orb[data-p="hist"]{left:0%;top:40%}.orb[data-p="rev"]{right:2%;top:42%}
.orb[data-p="coll"]{left:10%;bottom:18%}.orb[data-p="evo"]{right:10%;bottom:16%}
.orb[data-p="mental"]{left:50%;bottom:2%;transform:translateX(-50%)}

/* PORTAL — rainbow rings like screenshot bottom */
.portal{position:absolute;bottom:-50px;left:50%;transform:translateX(-50%);width:680px;height:190px;z-index:6}
.portal .hole{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#0a0e14 0%,#1a2332 38%,transparent 72%);border-radius:50%;box-shadow:inset 0 22px 60px rgba(0,0,0,.65)}
.portal .rings{position:absolute;inset:-16px;border-radius:50%;background:conic-gradient(from 180deg,#FF5A2E,#FFD93D,#6BFF8A,#5A8CFF,#B07AFF,#FF5A2E);animation:spin 14s linear infinite;mask:radial-gradient(ellipse,transparent 54%,black 57%,black 72%,transparent 74%)}
.portal .rings2{position:absolute;inset:-32px;border-radius:50%;background:conic-gradient(from 90deg,#5A8CFF,#B07AFF,#FF5A2E,#FFD93D,#6BFF8A,#5A8CFF);animation:spin 22s linear infinite reverse;opacity:.6;mask:radial-gradient(ellipse,transparent 68%,black 71%,black 76%,transparent 79%)}
.portal .mist{position:absolute;bottom:60%;left:50%;transform:translateX(-50%);width:280px;height:80px;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.9) 0%,transparent 70%);filter:blur(4px);animation:float 3s ease-in-out infinite}

/* SVG ARC */
#svgLayer{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}

/* GARDEN MODAL — after teleport */
#garden{position:fixed;inset:0;z-index:100;display:none;background:rgba(126,200,240,.38);backdrop-filter:blur(16px);padding:16px}
#garden.active{display:grid;place-items:center;animation:fade .45s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.gBox{width:min(900px,96vw);background:rgba(255,251,242,.97);border-radius:24px;border:1px solid rgba(255,106,26,.24);box-shadow:0 30px 90px rgba(0,0,0,.28);overflow:hidden;display:grid;grid-template-rows:auto auto 1fr}
.gHead{padding:14px 18px;background:linear-gradient(90deg,#7EC8F0,#FFE8D6);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,106,26,.2)}
.tabs{display:flex;gap:6px;padding:10px 14px;background:rgba(255,255,255,.7);flex-wrap:wrap;border-bottom:1px solid rgba(0,0,0,.06)}
.tab{padding:7px 14px;border-radius:20px;border:1px solid rgba(26,42,58,.15);background:#fff;cursor:pointer;font-size:9px;font-family:'JetBrains Mono'}
.tab.active{background:var(--ink);color:#fff}
.gContent{padding:20px;min-height:240px;line-height:1.75;font-size:14px;color:#2a3a4a;overflow:auto}
.gContent h3{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--orange);margin-bottom:8px}
.flyClone{position:fixed;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;z-index:30;pointer-events:none}
</style>
</head>
<body>
<div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
<div class="top mono"><div>b10.online | Binary Phoenix</div><div>☀️ SUN BRIGHT • CUMULUS DEEP ORANGE • 12,847 SYNCED</div></div>

<div class="bay">
<div class="orbit"></div><div class="diamond"></div>
<div class="portal" id="portal"><div class="rings"></div><div class="rings2"></div><div class="hole"></div><div class="mist"></div></div>
<div class="orbs">
<div class="orb" data-p="cosmos" data-theme="cosmos"><div class="ic">🪐</div><label>Cosmos Exploration</label></div>
<div class="orb" data-p="comm" data-theme="community"><div class="ic">👥</div><label>Community</label></div>
<div class="orb" data-p="ai" data-theme="ai"><div class="ic">🧠</div><label>Future of AI</label></div>
<div class="orb" data-p="hist" data-theme="history"><div class="ic">📜</div><label>History</label></div>
<div class="orb" data-p="rev" data-theme="reverse"><div class="ic">⚙️</div><label>Reverse Engineering</label></div>
<div class="orb" data-p="coll" data-theme="collective"><div class="ic">🕸️</div><label>Collective Consciousness</label></div>
<div class="orb" data-p="evo" data-theme="evolution"><div class="ic">🧬</div><label>Evolution</label></div>
<div class="orb" data-p="mental" data-theme="mental"><div class="ic">🧠</div><label>Mental Health</label></div>
</div>
</div>

<svg id="svgLayer"></svg>

<div id="garden"><div class="gBox">
<div class="gHead"><div id="gTitle" style="font-weight:700">GARDEN</div><button onclick="closeG()" style="padding:6px 14px;border-radius:20px;border:1px solid rgba(0,0,0,.15);background:#fff;cursor:pointer">✕ return to sky</button></div>
<div class="tabs"><button class="tab active" data-tab="narrative" onclick="switchT(this)">NARRATIVE DESIGN</button><button class="tab" data-tab="symbolism" onclick="switchT(this)">SYMBOLISM</button><button class="tab" data-tab="psychology" onclick="switchT(this)">AUDIENCE PSYCHOLOGY</button><button class="tab" data-tab="spiritual" onclick="switchT(this)">SPIRITUAL INTUITION</button></div>
<div class="gContent" id="gContent"></div>
<div style="padding:0 18px 14px" class="mono">from server of my experiences — we will venture on later • fertile soil • shamba 0-100% • womb not grave</div>
</div></div>

<script>
const DATA={
mental:{title:"🧠 Mental Health — Fertile Void Garden",n:"Chapter 0 ASHES: Village → city sickness, 3-4am shadow CCTV fear. Starts in fertile hole Page 3 doc — absorbing, transmuting, regenerating. Teleport falls softly into womb not grave, breathes 7.2s.",s:"Black void 0-18% Shamba rings = ash, light sand 86-100% = bloom. Rainbow rings around hole. Orange alloy you, black+red fish guarding same core. Anxiety data -0.12 not enemy.",p:"Scared One needs GROUND. Milk sky blue #7EC8F0 + cumulus peach + sun bright = safety, not neon void. Portal transport = being held. Deep orange rim = hope hold.",sp:"Server: soil free to use mother not resource. Moiben soil womb. Bare branch → bloom. Binary Fhoenix rebirth starts here."},
collective:{title:"🕸️ Collective Consciousness — Mycelial Garden",n:"SPARK: Page 2 bioluminescent forest glowing mushrooms, ferns. Flocks law, fungal consciousness. One scrolls, nodes connect. 'I am scared' → 'We breathe together'.",s:"Mycelial threads blue-purple, orb web icon. Rainbow nerve carrying ocean signals. Each mind = node in concentric rings 0-100%.",p:"Seeker belonging: big cumulus overlapping = we are clouds not separate. 12,847 synced makes them flock not alone. Teleport into shared root = joining.",sp:"Moiben millet runners moving as one, no leader pattern. Shamba = cultivated plot not owned — collective holds."},
evolution:{title:"🧬 Evolution — Perrogasus Garden",n:"FLIGHT: Page 8 Perrogasus white dog rainbow wings over river + rainbow, Page 1 dog with tie + elf child diamond. Evolution = joyful hybrid impossible that runs anyway.",s:"Perrogasus = Pegasus+dog. Thick tree 10,911m rainbow nerves. Bare → bloom. Not fittest but most joyful survives.",p:"Burned achievers: evolution not becoming better but more you. Cumulus evolving shapes slowly, deep orange = transformation warm not painful.",sp:"Hybrid you: binary+phoenix, village+city, code+soil. Circular Shamba rings return to light sand outer."},
reverse:{title:"🛠️ Reverse Engineering — Diamond Lab Garden",n:"CODE: Page 1 elf child + dog staring at floating octahedron diamond rainbow portal — curiosity engine. You reverse engineered self on i5 Tesseract.js, PDF-lib, no server cost.",s:"Octahedron diamond tech artifact Page1/2/8 floating transparent rainbow rings. Pattern you can open. City sickness firmware contains village.",p:"Builders/tinkerers: sky blue day + bright sun = clarity transparency. Deep orange rim = safe to disassemble. They want SEE how it works.",sp:"Reverse engineering as remembering not hacking. Server = Moiben soil free guest free harmony — opening soil source code."},
ai:{title:"🤖 Future of AI — Transparent 86% Garden",n:"CODE continued: Page7 transparent alien rainbow body infinity stones forest — 86% transparent rainbow nerves visible. Future AI not black box but transparent body.",s:"Alien iridescent skeleton galaxy chest, stones surrounding. AI future = stones you hold around not inside controlling you. SESE side-by-side.",p:"AI anxious: sky blue day future not dystopian night. Cumulus soft = AI clouds holding you. Warm intelligence orange not cold.",sp:"Fear AI replace you → realizing you ARE intelligence training it. Binary Fhoenix = human+machine phoenix. No hidden motives."},
cosmos:{title:"🪐 Cosmos Exploration — Octahedron Ship Garden",n:"ORBIT: Page1 &2 diamond floating rainbow portal vertical/horizontal, elf children looking up. Cosmos not far — portal above shamba. Teleport = wormhole.",s:"Rainbow signal ocean surface → Saturn rainbow rings. Diamond ship doesn't leave soil — dives down through fertile hole to cosmos. Above=below same.",p:"Dreamers feeling small: sky infinite warm day, not cold void. Held in orbit. Big clouds = nebulas nearby. Deep orange = cosmos warm.",sp:"Moiben night sky vs city sky. Fertile hole is wormhole. Octahedron 8 faces = 8 themes around it."},
community:{title:"👥 Community — Soil Free Guest Free Garden",n:"FLOCK: Page5 soil profile concentric rings — soil free guest free harmony, free to use open for study. Population = community = no title deed for soul.",s:"Shamba rings 35-42% golden yellow, 27-34% brown soil layered not flat. Fertile hole bottom = community source all return.",p:"Elder community: same sky sun shared, same sun for all. Clouds overlapping = togetherness without losing shape. Portal = source.",sp:"Deepest server: Moiben harmony, millet runner flock moving as one, village soil no one owns but all care. Flock law."},
history:{title:"📜 History + Population — Infinity Stones Garden",n:"MEMORY: Page4 infinity stones evolution void→sparks→transformation blooming→rainbow garden evolution. History not line but 4 stages garden. Population = garden expanding.",s:"Page4/6 stones gold filigree circle reflection lake. 6 stones = space mind reality power time soul. Contained gold ring = history held safely not hoarded. Rainbow bridge.",p:"Historians keepers: clouds hold water history ocean. Deep orange sunset history held warmly. Sun bright = future history still written.",sp:"History as rings not line. Shamba 0-100% each ring era black void 0-18% to light sand 86-100%. Memory protected safe containment."}
};
let cur='mental',tab='narrative';
const svg=document.getElementById('svgLayer'), portal=document.getElementById('portal');
const getCenter=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};

document.querySelectorAll('.orb').forEach(o=>{
 o.addEventListener('click',()=>{
  const theme=o.dataset.theme;
  const s=getCenter(o), e=getCenter(portal);
  const midX=(s.x+e.x)/2, midY=Math.min(s.y,e.y)-200;
  // SVG arc
  svg.innerHTML=`<defs><linearGradient id="g"><stop offset="0%" stop-color="#FF6A1A"/><stop offset="100%" stop-color="#B07AFF"/></linearGradient></defs><path d="M ${s.x} ${s.y} Q ${midX} ${midY} ${e.x} ${e.y}" stroke="url(#g)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="14 10" style="animation:dash .6s linear infinite;filter:blur(.5px)"/>`;
  // flying clone
  const clone=document.createElement('div'); clone.className='flyClone orb'; clone.innerHTML=o.innerHTML; clone.style.left=(s.x-59)+'px'; clone.style.top=(s.y-59)+'px';
  document.body.appendChild(clone);
  let t0=null;
  function anim(t){
   if(!t0) t0=t;
   const p=Math.min((t-t0)/900,1), ease=1-Math.pow(1-p,3);
   const x=(1-ease)*(1-ease)*s.x +2*(1-ease)*ease*midX +ease*ease*e.x;
   const y=(1-ease)*(1-ease)*s.y +2*(1-ease)*ease*midY +ease*ease*e.y;
   clone.style.left=(x-59)+'px'; clone.style.top=(y-59)+'px';
   clone.style.transform=`scale(${1-0.55*ease})`; clone.style.filter=`blur(${ease*3}px) brightness(${1+ease*.6})`;
   if(p<1) requestAnimationFrame(anim); else {clone.remove(); svg.innerHTML=''; portal.animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(1.2)'},{transform:'translateX(-50%) scale(1)'}],{duration:450}); openG(theme);}
  }
  requestAnimationFrame(anim);
 });
});

function openG(theme){cur=theme; tab='narrative'; document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); document.querySelector('[data-tab="narrative"]').classList.add('active'); document.getElementById('gTitle').textContent=DATA[theme].title; render(); document.getElementById('garden').classList.add('active');}
function render(){const d=DATA[cur][tab==='narrative'?'n':tab==='symbolism'?'s':tab==='psychology'?'p':'sp']; const map={narrative:'NARRATIVE DESIGN',symbolism:'SYMBOLISM',psychology:'AUDIENCE PSYCHOLOGY',spiritual:'SPIRITUAL INTUITION — from server of my experiences'}; document.getElementById('gContent').innerHTML=`<h3>${map[tab]}</h3><div>${d}</div><br><div class=mono style=opacity:.5>Theme: ${cur} • Portal transport completed • Sky blue landing bay • fertile hole womb not grave</div><br><button class="tab" style="background:#1a2a3a;color:#fff" onclick="alert('Server of experiences will load here for ${cur} — we will venture on later')">VENTURE SERVER →</button>`}
function switchT(el){tab=el.dataset.tab; document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); el.classList.add('active'); render();}
function closeG(){document.getElementById('garden').classList.remove('active');}
</script>
<style>@keyframes dash{to{stroke-dashoffset:-24}}</style>
</body>
</html>
