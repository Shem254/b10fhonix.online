<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>b10.online — Binary Fhoenix Landing Bay</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--sky:#87CEEB;--sky2:#E0F6FF;--orange:#FF7A2E;--sun:#FFF1A0;--ink:#1a2a3a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;overflow:hidden;background:radial-gradient(800px 500px at 85% 15%, var(--sun) 0%, #FFD27A 15%, var(--orange) 28%, var(--sky) 58%, var(--sky2) 100%);min-height:100vh;color:var(--ink)}
.mono{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em}
/* SUN */
.sun{position:absolute;top:6%;right:8%;width:88px;height:88px;background:radial-gradient(circle at 50% 50%, #FFFFFF 0%, var(--sun) 35%, #FFC14A 70%);border-radius:50%;box-shadow:0 0 80px 30px rgba(255,213,80,0.8), 0 0 140px 60px rgba(255,122,46,0.45);z-index:1}
/* CUMULUS CLOUDS with deep orange rim */
.cloud{position:absolute;background:#fff;border-radius:50%;box-shadow:inset -18px -12px 0 rgba(255,122,46,0.22), 0 10px 30px rgba(0,0,0,0.08);filter:blur(0.3px)}
.c1{left:-6%;top:18%;width:420px;height:180px;border-radius:60% 40% 50% / 60% 60% 40% 40%;box-shadow:inset -30px -20px 40px rgba(255,122,46,0.35), 0 20px 60px rgba(0,0,0,0.1)}
.c2{right:18%;bottom:12%;width:520px;height:160px;background:linear-gradient(180deg,#fff 0%, #FFE8D6 100%);border:1px solid rgba(255,122,46,0.2)}
.c3{left:12%;bottom:-4%;width:700px;height:200px;opacity:.9}
.c4{right:-4%;top:42%;width:360px;height:120px;opacity:.85}
.cloud:before,.cloud:after{content:'';position:absolute;background:#fff;border-radius:50%}
.c1:before{width:180px;height:180px;left:40px;top:-60px;box-shadow:inset -10px -10px 20px rgba(255,122,46,0.25)}
.c1:after{width:220px;height:140px;right:20px;top:-30px}
/* LANDING BAY */
.bay{position:relative;z-index:2;max-width:1200px;margin:0 auto;height:100vh;display:grid;place-items:center;padding:20px}
.topbar{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;z-index:10;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,0.3)}
.ring{position:absolute;width:760px;height:760px;left:50%;top:52%;transform:translate(-50%,-50%);border-radius:50%;border:1px dashed rgba(255,255,255,0.25);pointer-events:none}
.diamond{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;background:linear-gradient(135deg, #E6F7FF 0%, #9DD9FF 50%, #fff 100%);clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);box-shadow:0 0 30px rgba(157,217,255,0.9), 0 0 80px rgba(255,255,255,0.6);animation:float 4s ease-in-out infinite;z-index:3}
.diamond:after{content:'';position:absolute;inset:-18px;border-radius:50%;background:conic-gradient(from 0deg, #FF5A2E, #FFD93D, #6BFF8A, #5A8CFF, #B07AFF, #FF5A2E);filter:blur(12px);opacity:.6;z-index:-1;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-8px)}}
/* ORBS - 8 themes like infinity stones */
.orbs{position:relative;width:720px;height:620px}
.orb{position:absolute;width:122px;height:122px;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95) 0%, rgba(220,240,255,0.9) 35%, rgba(180,200,230,0.7) 100%);border:2px solid rgba(255,255,255,0.8);box-shadow:0 0 0 4px rgba(255,255,255,0.15), 0 0 20px rgba(255,255,255,0.6), inset 0 0 20px rgba(255,255,255,0.8);display:grid;place-items:center;cursor:pointer;transition:.4s;backdrop-filter:blur(6px)}
.orb:before{content:'';position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg, #FF7A2E, #FFD93D, #6BFF8A, #5A8CFF, #B07AFF, #FF7A2E);filter:blur(6px);opacity:.85;z-index:-1}
.orb:hover{transform:scale(1.12) translateY(-6px);box-shadow:0 0 0 6px rgba(255,255,255,0.3), 0 20px 40px rgba(0,0,0,0.2)}
.orb span.icon{font-size:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.2))}
.orb label{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(26,42,58,0.85);color:#fff;padding:4px 10px;border-radius:20px;font-size:8px;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono'}
.orb[data-pos="mental"]{left:44%;bottom:2%}
.orb[data-pos="collective"]{left:8%;bottom:18%}
.orb[data-pos="evolution"]{right:8%;bottom:18%}
.orb[data-pos="reverse"]{right:-2%;top:38%}
.orb[data-pos="ai"]{right:12%;top:12%}
.orb[data-pos="cosmos"]{left:50%;top:0%;transform:translateX(-50%)}
.orb[data-pos="community"]{left:18%;top:14%}
.orb[data-pos="history"]{left:-2%;top:40%}

/* FERTILE HOLE - from your doc page 3 */
.hole{position:absolute;bottom:-60px;left:50%;transform:translateX(-50%);width:680px;height:180px;background:radial-gradient(ellipse at 50% 50%, #0a0e14 0%, #1a2332 35%, transparent 72%);border-radius:50%;z-index:2;box-shadow:inset 0 20px 60px rgba(0,0,0,0.6)}
.hole:after{content:'';position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(from 0deg, #FF7A2E, #FFD93D, #6BFF8A, #5A8CFF, #B07AFF, #FF7A2E, #FF7A2E);filter:blur(0px);opacity:.9;animation:spin 12s linear infinite;mask:radial-gradient(ellipse, transparent 58%, black 62%)}
/* MODAL - narrative design, symbolism, audience psychology, spiritual intuition */
#modal{position:fixed;inset:0;z-index:999;display:none;background:rgba(135,206,235,0.35);backdrop-filter:blur(14px);padding:18px}
#modal.active{display:grid;place-items:center}
.box{width:min(860px,96vw);background:rgba(255,251,242,0.96);border-radius:24px;border:1px solid rgba(255,122,46,0.25);box-shadow:0 30px 80px rgba(0,0,0,0.25);overflow:hidden}
.boxHead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:linear-gradient(90deg, #87CEEB, #FFE8D6);border-bottom:1px solid rgba(255,122,46,0.2)}
.tabs{display:flex;gap:6px;padding:12px 16px;flex-wrap:wrap;background:rgba(255,255,255,0.6)}
.tab{padding:7px 14px;border-radius:20px;border:1px solid rgba(26,42,58,0.15);background:#fff;cursor:pointer;font-size:10px;font-family:'JetBrains Mono'}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.content{padding:20px;min-height:220px;font-size:14px;line-height:1.7;color:#2a3a4a}
.content h3{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--orange);margin-bottom:8px}
</style>
</head>
<body>
