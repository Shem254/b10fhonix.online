<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>b10.online — Binary Fhoenix Landing Bay • Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#D8ECF2;--sky2:#E6F2F8;--sun:#FFB84D;--orange:#FF6A1A;--orange2:#FF8C3A;--ink:#1e2f3f}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:var(--sky);overflow:hidden;height:100vh;width:100vw;position:relative}
.mono{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase}

/* SKY - corrected to match your screenshot light */
.sky{position:absolute;inset:0;background:radial-gradient(900px 600px at 88% 8%, var(--sun) 0%, var(--orange2) 14%, #FFB08A 22%, var(--sky) 48%, var(--sky2) 100%);z-index:0}
.sun{position:absolute;top:3%;right:6%;width:72px;height:72px;background:radial-gradient(circle at 50% 50%, #FFF9D6 0%, #FFE28A 40%, #FF9A3A 100%);border-radius:50%;box-shadow:0 0 60px 20px rgba(255,184,77,0.7), 0 0 160px 80px rgba(255,106,26,0.35);z-index:1}
.sunGlow{position:absolute;top:-6%;right:-4%;width:460px;height:460px;background:radial-gradient(circle at 70% 30%, rgba(255,106,26,0.28) 0%, rgba(255,140,58,0.18) 25%, transparent 70%);z-index:1;pointer-events:none;filter:blur(2px)}

/* CUMULUS - corrected to your screenshot - flat white with peach bottom */
.cloud{position:absolute;background:#fff;border-radius:50%;z-index:2}
.cloudFlat{position:absolute;background:#FFFFFF;box-shadow:0 12px 0 #FFE4D1, 0 18px 30px rgba(0,0,0,0.06);border-radius:50%}
.c-left{left:-2%;top:8%;width:300px;height:140px}
.c-left:before,.c-left:after{content:'';position:absolute;background:#fff;border-radius:50%}
.c-left:before{width:140px;height:120px;left:-20px;top:20px}
.c-left:after{width:180px;height:100px;left:60px;top:-10px}
.c-left .peach{position:absolute;bottom:-8px;left:10%;width:80%;height:28px;background:#FFDCC6;border-radius:50%;filter:blur(1px)}

.c-right{right:6%;top:46%;width:300px;height:80px}
.c-bottom-left{left:8%;bottom:6%;width:420px;height:110px}
.c-bottom-right{right:16%;bottom:14%;width:420px;height:110px}

/* LANDING BAY */
.topbar{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:10;color:#fff;font-size:9px;opacity:.9;text-shadow:0 1px 4px rgba(0,0,0,0.15)}
.bay{position:relative;z-index:3;width:100%;height:100vh;display:grid;place-items:center}
.orbit{position:absolute;width:680px;height:680px;border:1px dashed rgba(30,47,63,0.12);border-radius:50%;pointer-events:none}
.diamond{position:absolute;left:50%;top:50%;width:52px;height:52px;transform:translate(-50%,-50%) rotate(45deg);background:linear-gradient(135deg, #A8E8FF 0%, #FF8A8A 25%, #FFE08A 50%, #8AFFB0 75%, #A8A0FF 100%);box-shadow:0 0 20px rgba(168,232,255,0.8);animation:float 5s ease-in-out infinite;z-index:4}
@keyframes float{0%,100%{transform:translate(-50%,-50%) rotate(45deg) translateY(0)}50%{transform:translate(-50%,-50%) rotate(45deg) translateY(-8px)}}

/* ORBS - corrected rainbow like screenshot */
.orbs{position:relative;width:700px;height:600px}
.orb{position:absolute;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #FF9A3A 0%, #FF5A2E 18%, #FFD93D 32%, #7AFF8A 58%, #5A8CFF 78%, #B07AFF 100%);box-shadow:0 0 0 4px rgba(255,255,255,0.4), 0 0 18px rgba(255,255,255,0.7), inset 0 -6px 12px rgba(0,0,0,0.1);display:grid;place-items:center;cursor:pointer;transition:transform .3s;z-index:5;filter:saturate(0.9) brightness(1.05)}
.orb:hover{transform:scale(1.15)}
.orb .icon{font-size:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.25));background:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;border:1px solid rgba(0,0,0,0.1)}
.orb label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);background:#2a3340;color:#fff;padding:3px 8px;border-radius:10px;font-size:7px;white-space:nowrap;letter-spacing:.08em}
.orb[data-pos="cosmos"]{left:48%;top:2%;transform:translateX(-50%)}
.orb[data-pos="community"]{left:22%;top:18%}
.orb[data-pos="ai"]{right:18%;top:18%}
.orb[data-pos="history"]{left:8%;top:42%}
.orb[data-pos="reverse"]{right:6%;top:42%}
.orb[data-pos="collective"]{left:16%;bottom:22%}
.orb[data-pos="evolution"]{right:16%;bottom:14%}
.orb[data-pos="mental"]{left:46%;bottom:4%;transform:translateX(-50%)}

/* PORTAL VOID - transport portal */
.portal{position:absolute;bottom:-40px;left:50%;transform:translateX(-50%);width:520px;height:150px;z-index:6;cursor:pointer}
.portal .disk{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%, #0d141e 0%, #2a3442 28%, #8a94a2 62%, #e8edf2 78%);border-radius:50%;box-shadow:inset 0 18px 30px rgba(0,0,0,0.6), 0 10px 40px rgba(0,0,0,0.2)}
.portal .rim{position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);pointer-events:none}
.portal .swirl{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 180deg, #0d141e 0%, #0d141e 70%, transparent 100%);animation:spin 3s linear infinite;mix-blend-mode:multiply;opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
.portal.active{animation:portalPulse 0.6s ease}
@keyframes portalPulse{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}

/* TELEPORTATION TRAIL */
.trail{position:absolute;width:4px;height:4px;border-radius:50%;pointer-events:none;z-index:20}
.arc{position:absolute;pointer-events:none;z-index:7;stroke-linecap:round;fill:none;filter:blur(0.5px)}

/* GARDEN MODAL - after teleport */
#garden{position:fixed;inset:0;z-index:100;display:none;background:rgba(216,236,242,0.88);backdrop-filter:blur(18px)}
#garden.active{display:grid;place-items:center;animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.gBox{width:min(980px,94vw);height:min(86vh,800px);background:rgba(255,255,255,0.94);border-radius:28px;border:1px solid rgba(255,106,26,0.18);box-shadow:0 30px 90px rgba(0,0,0,0.22);overflow:hidden;display:grid;grid-template-rows:auto 1fr;position:relative}
.gHead{padding:14px 18px;background:linear-gradient(90deg, #D8ECF2, #FFE4D1);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,106,26,0.15)}
.tabs{display:flex;gap:6px;padding:10px 14px;background:#fff;border-bottom:1px solid rgba(0,0,0,0.06);flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:20px;border:1px solid rgba(0,0,0,0.12);background:#fff;cursor:pointer;font-size:9px}
.tab.active{background:#1e2f3f;color:#fff}
.gContent{padding:18px;overflow-y:auto;line-height:1.7;font-size:14px}
.gContent h3{font-size:10px;color:#FF6A1A;letter-spacing:.15em;margin-bottom:8px}
.gardenBg{position:absolute;right:-20px;top:60px;width:260px;height:260px;opacity:.14;pointer-events:none;font-size:120px}
</style>
</head>
<body>
<div class="sky"></div><div class="sun"></div><div class="sunGlow"></div>
<div class="cloudFlat c-left"><div class="peach"></div></div>
<div class="cloudFlat c-right"></div>
<div class="cloudFlat c-bottom-left"></div>
<div class="cloudFlat c-bottom-right"></div>

<div class="topbar mono"><div>b10.online | Binary Phoenix — landing bay • fertile soil • sky blue</div><div>☀️ SUN BRIGHT • CUMULUS DEEP ORANGE • 12,847 SYNCED</div></div>

<div class="bay">
<div class="orbit"></div><div class="diamond"></div>
<div class="orbs">
<div class="orb" data-pos="cosmos" data-theme="cosmos"><div class="icon">🪐</div><label>cosmos exploration</label></div>
<div class="orb" data-pos="community" data-theme="community"><div class="icon">👥</div><label>community</label></div>
<div class="orb" data-pos="ai" data-theme="ai"><div class="icon">🤖</div><label>future of ai</label></div>
<div class="orb" data-pos="history" data-theme="history"><div class="icon">📜</div><label>history</label></div>
<div class="orb" data-pos="reverse" data-theme="reverse"><div class="icon">🛠️</div><label>reverse engineering</label></div>
<div class="orb" data-pos="collective" data-theme="collective"><div class="icon">🕸️</div><label>collective consciousness</label></div>
<div class="orb" data-pos="evolution" data-theme="evolution"><div class="icon">🧬</div><label>evolution</label></div>
<div class="orb" data-pos="mental" data-theme="mental"><div class="icon">🧠</div><label>mental health</label></div>
</div>
<div class="portal" id="portal"><div class="disk"></div><div class="swirl"></div><div class="rim"></div></div>
</div>

<svg id="svgLayer" style="position:fixed;inset:0;pointer-events:none;z-index:8;width:100%;height:100%"></svg>

<div id="garden"><div class="gBox">
<div class="gHead"><div id="gTitle" style="font-weight:700">GARDEN</div><button onclick="closeGarden()" style="padding:6px 14px;border-radius:20px;border:1px solid rgba(0,0,0,0.15);background:#fff;cursor:pointer">✕ return to sky</button></div>
<div class="tabs"><button class="tab active" data-tab="narrative" onclick="switchTab(this)">NARRATIVE DESIGN</button><button class="tab" data-tab="symbolism" onclick="switchTab(this)">SYMBOLISM</button><button class="tab" data-tab="psychology" onclick="switchTab(this)">AUDIENCE PSYCHOLOGY</button><button class="tab" data-tab="spiritual" onclick="switchTab(this)">SPIRITUAL INTUITION</button></div>
<div class="gContent" id="gContent"></div><div class="gardenBg" id="gBg">🌱</div>
</div></div>

<script>
const THEMES={
mental:{title:"🧠 Mental Health — Fertile Void Garden",icon:"🧠",narrative:"ASHES chapter from your doc Page 3 fertile hole: village → city sickness, 3-4am shadow. Story starts in portal womb not grave. User arrives via teleport — they were orb, now they fall softly into void that breathes 7.2s.",symbolism:"Fertile hole concentric rainbow rings 0-100% Shamba soil rings doc. Black void 0-18% = ash, light sand 86-100% = bloom. Orange alloy = you, black+red fish guarding = fear+love together.",psychology:"Scared One needs GROUND. Sky blue milk tone reduces cortisol vs old dark neon. Sun bright + cumulus peach = safe day. Portal transport feels like being held, not dropping.",spiritual:"Server experience: soil profile free to use — mother not resource. Moiben soil as womb. This garden = absorbing, transmuting, regenerating."},
collective:{title:"🕸️ Collective Consciousness — Mycelial Garden",icon:"🕸️",narrative:"SPARK: Page 2 bioluminescent forest, glowing mushrooms. Flocks law — no leader, pattern. Portal transports orb into underground mycelial network where 12,847 lights sync.",symbolism:"Mycelial threads = internet before internet. Rainbow nerves carrying ocean signals. Each orb = node.",psychology:"Seeker belonging: cumulus overlapping = we are clouds not separate. Teleport into shared root feels like joining.",spiritual:"Millet field runners moving as one, Moiben. Shamba = cultivated plot not owned plot."},
evolution:{title:"🧬 Evolution — Perrogasus Garden",icon:"🧬",narrative:"FLIGHT: Page 8 Perrogasus white dog with rainbow wings over river. Bloom after bare. Evolution = joyful hybrid impossible.",symbolism:"Perrogasus, thick baobab 10,911m with rainbow nerves, bare → bloom.",psychology:"Burned achievers: evolution as warm flight not struggle. Deep orange glow = transformation warm.",spiritual:"Hybrid you: binary+phoenix, village+city, code+soil. Circular Shamba rings."},
reverse:{title:"🛠️ Reverse Engineering — Diamond Lab Garden",icon:"🛠️",narrative:"CODE: Page 1 elf child staring at octahedron diamond rainbow portal — curiosity engine. You reverse engineered self on i5.",symbolism:"Octahedron floating = pattern you can open. City sickness firmware contains village.",psychology:"Builders: sky blue day = clarity transparency. Deep orange = safe curiosity.",spiritual:"Reverse engineering as remembering. Opening soil source code."},
ai:{title:"🤖 Future of AI — Transparent Body Garden",icon:"🤖",narrative:"Page 7 transparent alien rainbow body with infinity stones. Future AI = transparent 86% not black box. Portal = stones you choose to hold around not inside controlling.",symbolism:"Transparent body galaxy chest, infinity stones surrounding. SESE side-by-side editor = collaborative.",psychology:"AI anxious: sky blue day future not dystopian night. Cumulus soft = AI as clouds holding.",spiritual:"You ARE intelligence training it. Binary Fhoenix = human+machine phoenix."},
cosmos:{title:"🪐 Cosmos Exploration — Octahedron Ship Garden",icon:"🪐",narrative:"ORBIT: Page 1 & 2 diamond with rainbow portal vertical/horizontal. Cosmos not far — portal above shamba. Portal transport = wormhole.",symbolism:"Rainbow signal ocean surface → Saturn rings. Diamond ship dives down to cosmos above=below same.",psychology:"Dreamers feeling small: sky infinite warm day. You held in orbit.",spiritual:"Moiben night sky vs city sky. Fertile hole is wormhole."},
community:{title:"👥 Community — Soil Free Guest Free Garden",icon:"👥",narrative:"FLOCK: Page 5 soil profile concentric rings — soil free guest free harmony, free to use open for study. Population = garden expanding.",symbolism:"Shamba soil rings 35-42% golden yellow community layered. Portal bottom = community source.",psychology:"Elder builders: same sky sun same for all. Clouds overlapping = togetherness.",spiritual:"Moiben harmony, flock law, no title deed for soul."},
history:{title:"📜 History + Population — Infinity Stones Garden",icon:"📜",narrative:"MEMORY: Page 4 infinity stones evolution void→sparks→transformation→rainbow garden. History = 4 stages. Population = garden expanding.",symbolism:"Page 4/6 stones in gold filigree circle reflection lake. 6 stones = space mind reality power time soul.",psychology:"Keepers: clouds hold water history ocean. Deep orange sunset history held warmly.",spiritual:"History as rings not line. Shamba 0-100% each ring era. Safe containment = memory protected."}
};

let curTheme='mental', curTab='narrative';
const svg=document.getElementById('svgLayer');
const portal=document.getElementById('portal');
const portalCenter=()=>{const r=portal.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2}}

document.querySelectorAll('.orb').forEach(orb=>{
  orb.addEventListener('click',()=>{
    const theme=orb.dataset.theme;
    const rect=orb.getBoundingClientRect();
    const start={x:rect.left+rect.width/2,y:rect.top+rect.height/2};
    const end=portalCenter();
    teleport(start,end,orb,theme);
  })
});

function teleport(start,end,orbEl,theme){
  orbEl.style.pointerEvents='none';
  portal.classList.add('active');
  // create arc path
  const midX=(start.x+end.x)/2;
  const midY=Math.min(start.y,end.y)-180 - Math.random()*80;
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  const d=`M ${start.x} ${start.y} Q ${midX} ${midY} ${end.x} ${end.y}`;
  path.setAttribute('d',d);
  path.setAttribute('stroke',`url(#grad-${theme})`);
  path.setAttribute('stroke-width','5');
  path.style.strokeDasharray='12 8';
  path.style.animation='dash 0.8s linear infinite';
  // define gradient
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  const grad=document.createElementNS('http://www.w3.org/2000/svg','linearGradient');
  grad.id=`grad-${theme}`; grad.innerHTML=`<stop offset="0%" stop-color="#FF6A1A"/><stop offset="50%" stop-color="#B07AFF"/><stop offset="100%" stop-color="#5A8CFF"/>`;
  defs.appendChild(grad);
  svg.appendChild(defs); svg.appendChild(path);
  // flying orb clone
  const fly=document.createElement('div');
  fly.className='orb'; fly.style.position='fixed'; fly.style.left=start.x-46+'px'; fly.style.top=start.y-46+'px'; fly.style.margin='0'; fly.style.zIndex='30'; fly.style.transition='none';
  fly.innerHTML=orbEl.innerHTML;
  document.body.appendChild(fly);
  // animate along path
  const duration=900;
  let startTime=null;
  function animate(t){
    if(!startTime) startTime=t;
    const p=Math.min((t-startTime)/duration,1);
    const ease=1-Math.pow(1-p,3);
    // quadratic bezier
    const x=(1-ease)*(1-ease)*start.x + 2*(1-ease)*ease*midX + ease*ease*end.x;
    const y=(1-ease)*(1-ease)*start.y + 2*(1-ease)*ease*midY + ease*ease*end.y;
    fly.style.left=x-46+'px'; fly.style.top=y-46+'px';
    fly.style.transform=`scale(${1-0.6*ease})`;
    fly.style.filter=`blur(${ease*2}px) brightness(${1+0.5*ease})`;
    if(p<1) requestAnimationFrame(animate);
    else{
      // hit portal
      portal.animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(1.25)'},{transform:'translateX(-50%) scale(1)'}],{duration:400,easing:'ease-out'});
      fly.remove(); path.remove();
      orbEl.style.pointerEvents='auto';
      svg.innerHTML='';
      openGarden(theme);
    }
  }
  requestAnimationFrame(animate);
}

function openGarden(theme){
  curTheme=theme; curTab='narrative';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelector('[data-tab="narrative"]').classList.add('active');
  document.getElementById('gTitle').textContent=THEMES[theme].title;
  document.getElementById('gBg').textContent=THEMES[theme].icon;
  renderGarden();
  document.getElementById('garden').classList.add('active');
}
function renderGarden(){
  const d=THEMES[curTheme][curTab];
  const map={narrative:"NARRATIVE DESIGN",symbolism:"SYMBOLISM",psychology:"AUDIENCE PSYCHOLOGY",spiritual:"SPIRITUAL INTUITION — from server of my experiences"};
  document.getElementById('gContent').innerHTML=`<h3>${map[curTab]}</h3><div>${d}</div><br><div class=mono style=opacity:.5>Theme: ${curTheme} • Portal transport completed • Garden from fertile soil doc • We will venture on later • sky blue landing bay</div><br><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="tab" style="background:#1e2f3f;color:#fff" onclick="alert('Venture later: server of experiences will load here for ${curTheme}')">VENTURE SERVER →</button><button class="tab" onclick="closeGarden()">↩ Back to Sky</button></div>`;
}
function switchTab(el){curTab=el.dataset.tab;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderGarden();}
function closeGarden(){document.getElementById('garden').classList.remove('active');}
</script>
<style>@keyframes dash{to{stroke-dashoffset:-20}}</style>
</body>
</html>
