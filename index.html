<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SESE V3 — Internal Cinema Engine — b10fhonix.online</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav"><div class="logo">SESE <span>V3</span> — INTERNAL CINEMA ENGINE</div><div class="small">Story → Narrative Compiler → Director → Continuity → Frame Engine → Timeline → Master</div><button id="exportBtn">EXPORT WEBM</button></div>
<div id="layout">
<div id="left" class="panel">
<h3>NARRATIVE COMPILER</h3>
<textarea id="storyInput" placeholder="Paste story... A young man wakes up in a dark room hearing an electric pulse..."></textarea>
<div class="row"><select id="genre"><option>Afro Sci-Fi Healing</option><option>Sci-Fi Thriller</option><option>Cinematic Drama</option><option>Afrofuturism</option></select>
<select id="lensPack"><option value="anamorphic">Anamorphic 35mm</option><option value="spherical">Spherical 50mm</option><option value="macro">Macro 100mm</option><option value="wide">Wide 24mm</option></select></div>
<button id="compileBtn" class="primary">COMPILE STORY → SCENE GRAPH</button>
<button id="loadBtn">Load Example</button>
<pre id="sceneGraph" class="code"></pre>
</div>
<div id="center" class="panel">
<h3>CINEMATOGRAPHY ENGINE — <span id="shotLabel">No shot</span></h3>
<div id="stage"><canvas id="masterCanvas" width="1920" height="1080"></canvas><canvas id="hiddenCanvas" width="1920" height="1080" style="display:none"></canvas></div>
<div class="row" style="margin-top:8px"><div class="progress"><div id="progress"></div></div><span id="timecode" class="small">00:00:00:00</span></div>
<div id="shotStrip"></div>
<div id="timeline"></div>
<div class="row"><button id="renderAll" class="primary">RENDER ALL SHOTS</button><button id="playBtn">PLAY TIMELINE</button><button id="masterBtn" class="primary">MASTER → WEBM</button></div>
<div id="final"></div>
<pre id="log" class="code" style="height:160px"></pre>
</div>
<div id="right" class="panel">
<h3>DIRECTOR / CONTINUITY</h3>
<div id="charBible" class="small">Characters will compile here</div>
<div id="worldBible" class="small" style="margin-top:10px"></div>
<h3 style="margin-top:14px">SHOT GRAPH</h3>
<pre id="shotGraph" class="code"></pre>
<h3>PROPERTIES</h3>
<label class="small">Camera Rig</label><select id="cameraRig"><option value="dolly_in">Dolly In</option><option value="orbit">Orbit 30deg</option><option value="crane_up">Crane Up</option><option value="handheld">Handheld</option><option value="static">Static</option></select>
<label class="small">Light</label><select id="lightModel"><option value="volumetric">Volumetric</option><option value="neon">Neon Pulse</option><option value="dawn">Dawn Portal</option></select>
<pre id="movieJson" class="code" style="max-height:220px"></pre>
<button id="exportJson">Export.sese.json</button>
</div>
</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
